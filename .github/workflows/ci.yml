name: CI

# Cloudflare Pages builds and publishes on every push to main; this catches
# a broken build — a dead link, most often — before that, and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Before setup-node: its cache asks `yarn` where the cache is, and that
      # must be the Yarn package.json pins, not the runner's Yarn 1.
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
